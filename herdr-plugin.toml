# herdr plugin manifest. Install with:
#   herdr plugin install maumercado/herdr-remotes-management
# or, from a checkout you are working on:
#   herdr plugin link /path/to/herdr-remotes-management
id = "herdr-machines"
name = "Machines"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Add, edit, rename and delete SSH machines once for ~/.ssh/config, the herdr TUI and the Herdr app"
platforms = ["linux", "macos"]

# Install fails here when Node 22.18+, ssh or herdr is missing (hc is optional).
[[build]]
command = ["sh", "bin/run", "check"]

# Links ~/.config/herdr-app/mods/herdr-machines to this plugin's app-mod folder,
# so the Herdr app's Machines dialog updates with the plugin.
[[build]]
command = ["sh", "bin/install-app-mod"]

# Same at each herdr start, so a linked plugin gets the dialog too
# (`herdr plugin link` runs no build steps). Exits at once when nothing changed.
[[startup]]
command = ["sh", "bin/install-app-mod"]

# The manager itself: a popup running the CLI's terminal UI.
[[panes]]
id = "manager"
title = "Machines"
placement = "popup"
width = "90%"
height = "80%"
command = ["sh", "bin/run", "ui"]

# An action you can bind to a key (see README): opens the popup.
[[actions]]
id = "open"
title = "Manage machines"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin herdr-machines --entrypoint manager"]
